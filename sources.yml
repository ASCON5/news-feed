  - {name: Tproger,   type: rss, url: "https://tproger.ru/feed",                 tag: разработка}
  - {name: Proglib,   type: rss, url: "https://proglib.io/feed",                 tag: разработка}
  - {name: vc.ru,     type: rss, url: "https://vc.ru/rss/all",                   tag: технологии}
  # --- Гаджеты и железо ---
  - {name: 3DNews,      enabled: false, type: rss, url: "https://3dnews.ru/breakingnews/rss/", tag: технологии}  # адрес 404, нужен другой
  - {name: iXBT,        type: rss, url: "https://www.ixbt.com/export/news.rss",   tag: технологии}
  - {name: Overclockers, type: rss, url: "https://overclockers.ru/rss/all.rss",   tag: технологии}
  - {name: CNews,       type: rss, url: "https://www.cnews.ru/inc/rss/news.xml",  tag: технологии}
