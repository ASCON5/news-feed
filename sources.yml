  - {name: Хайтек,              type: rss, url: "https://hightech.fm/feed.rss",               tag: наука}
  # --- игры ---
  - {name: StopGame,  type: rss, url: "https://rss.stopgame.ru/rss_news.xml",    tag: игры}
