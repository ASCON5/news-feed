# Настройки и список источников. Отключить источник: enabled: false
# ВАЖНО: часть адресов я не мог проверить отсюда. Пробный запуск (dry_run) покажет, какие работают.

settings:
  max_age_hours: 24        # новости старше этого возраста игнорируются
  max_posts_per_run: 5     # новости: максимум за один запуск
  max_posts_per_day: 20    # новости: максимум за сутки
  max_opportunities_per_run: 5   # соревнования, гранты, стипендии: за запуск
  max_opportunities_per_day: 12  # ...и за сутки (отдельно от новостей)
  timezone_offset_hours: 5       # время в постах: Узбекистан = UTC+5
  timezone_label: "по Ташкенту"   # подпись к времени в постах
  delay_seconds: 3         # пауза между постами в канале
  title_similarity: 0.75   # 0..1, выше = строже склеивает дубли (подкручивать по результатам)
  min_title_len: 15        # для новостей (у соревнований названия бывают короткими)
  max_summary_chars: 350
  state_days: 60           # сколько дней помнить уже отправленное
  title_memory_days: 30    # сколько дней сравнивать новые заголовки со старыми
  link_preview: true       # карточка со ссылкой под постом (если у поста нет фото)
  images: true             # отправлять посты с фото, если оно нашлось (у источника можно images: false)

# Записи с этими фрагментами (в заголовке или тексте) считаются рекламой
ad_words:
  - "на правах рекламы"
  - "erid"
  - "промокод"
  - "партнёрский материал"
  - "партнерский материал"
  - "розыгрыш"
  - "скидк"

# Теги новостей по теме (берутся первые 2 подходящих). Если ничего не подошло, берётся тег источника.
# Это регулярные выражения по заголовку и тексту (без учёта регистра).
topics:
  ИИ: ['\bии\b', 'нейросет', 'искусственн\w+ интеллект', 'chatgpt', 'openai', 'anthropic', 'claude', 'gemini', '\bllm\b', '\bgpt', 'deepseek', 'copilot']
  безопасность: ['уязвимост', 'взлом', 'хакер', 'утечк', 'кибер', 'фишинг', 'malware', 'ransomware', '\bcve-', 'шифровальщик', 'вирус']
  разработка: ['\bpython', '\brust\b', '\bgo\b', 'golang', '\bphp\b', 'javascript', 'typescript', 'kotlin', 'github', 'программист', 'программирован', 'фреймворк', 'open source', 'linux', 'docker', 'devops', 'репозитор', 'компилятор', '\bapi\b', 'баз\w+ данных']
  железо: ['процессор', 'видеокарт', '\bssd\b', 'nvidia', '\bamd\b', '\bintel\b', 'смартфон', 'ноутбук', 'чипсет', 'оперативн', 'гаджет', 'iphone', '\bибп\b', 'монитор', 'роутер', 'сервер', 'видеопамят']
  игры: ['\bигр', 'steam', 'playstation', 'xbox', 'nintendo', 'геймер']
  наука: ['учёны', 'ученые', 'исследовател', 'физик', 'астроном', 'космос', 'биолог', 'генетик']

sources:
