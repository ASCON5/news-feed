# Настройки и список источников. Отключить источник: enabled: false
# Все источники на русском. Пробный запуск (dry_run) покажет, какие сейчас отвечают.

settings:
  max_age_hours: 12        # новости старше этого возраста игнорируются
  max_posts_per_run: 5     # максимум постов за один запуск
  max_posts_per_day: 30    # максимум постов за сутки
  tag_limits_per_day:      # отдельный потолок за сутки для тегов источников (чтобы политики было немного)
    мир: 4
    узбекистан: 2
  timezone_offset_hours: 5       # время в постах: Узбекистан = UTC+5
  timezone_label: "по Ташкенту"   # подпись к времени в постах
  delay_seconds: 3         # пауза между постами в канале
  title_similarity: 0.75   # 0..1, выше = строже склеивает дубли (подкручивать по результатам)
  min_title_len: 15
  max_summary_chars: 350   # текст поста: столько символов законченными предложениями
  state_days: 60           # сколько дней помнить уже отправленное
  title_memory_days: 30    # сколько дней сравнивать новые заголовки со старыми
  link_preview: true       # карточка со ссылкой под постом (если у поста нет фото)
  images: true             # отправлять посты с фото, если оно нашлось (у источника можно images: false)

# Записи с этими фрагментами (в заголовке или тексте) не публикуются: реклама и развлекательные тесты
ad_words:
  - "на правах рекламы"
  - "erid"
  - "промокод"
  - "партнёрский материал"
  - "партнерский материал"
  - "розыгрыш"
  - "скидк"
  # викторины и тесты (их много у «Популярной механики»)
  - "отличия за"
  - "попробуйте найти"
  - "сможете ли вы"
  - "сможете найти"
  - "сможете отыскать"
  - "сможете разгадать"
  - "найдите на картинке"
  - "угадайте"
  - "разминка"
  - "проверка зоркости"
  - "проверьте свой"
  - "каверзных вопрос"
  - "тест на внимательность"
  - "тест-вопрос"
  - "тест-минутк"
  - "ответите на"
  - "кругозор"
  - "логическую загадку"
  - "головоломк"
  - "гороскоп"
  - "викторин"
  - "кроссворд"

# Теги по теме (берутся первые 2 подходящих). Если ничего не подошло, берётся тег источника.
# Это регулярные выражения по заголовку и тексту (без учёта регистра).
topics:
  ИИ: ['\bии\b', 'нейросет', 'искусственн\w+ интеллект', 'машинн\w+ обучени', 'chatgpt', 'openai', 'anthropic', 'claude', 'gemini', '\bllm\b', '\bgpt', 'deepseek', 'copilot', 'qwen', '\bgrok\b', 'midjourney', 'gigachat', 'гигачат']
  роботы: ['робот', 'гуманоид', 'беспилот', 'boston dynamics', 'unitree']
  безопасность: ['уязвимост', 'взлом', 'хакер', 'утечк\w* данных', 'кибер', 'фишинг', 'malware', 'ransomware', '\bcve-', 'шифровальщик', 'вирус']
  опенсорс: ['open[ -]source', 'открыт\w* (исходн|код)', 'опенсорс', '\blinux', 'дистрибутив', '\bgnu\b', 'freebsd', 'github', 'gitlab']
  разработка: ['\bpython', '\brust\b', '\bgo\b', 'golang', '\bphp\b', '\bjava\b', 'javascript', 'typescript', 'kotlin', 'c\+\+', 'программист', 'программирован', 'фреймворк', 'docker', 'kubernetes', 'devops', 'репозитор', 'компилятор', '\bapi\b', 'баз\w+ данных']
  техника: ['процессор', 'видеокарт', '\bssd\b', 'nvidia', '\bamd\b', '\bintel\b', 'смартфон', 'ноутбук', 'чипсет', 'оперативн\w+ памят', 'гаджет', 'iphone', 'android', 'samsung', 'xiaomi', '\bибп\b', 'монитор', 'роутер', 'сервер', 'видеопамят', 'наушник', 'электромобил']
  космос: ['космос', 'космическ', '\bnasa\b', 'роскосмос', 'spacex', 'starship', 'ракета-носител', 'спутник', '\bмарс', '\bлун[аеуы]\b', 'астероид', 'телескоп', 'орбит', '\bмкс\b']
  наука: ['учёны', 'ученые', 'исследовател', 'физик', 'биолог', 'генетик', 'палеонтолог', 'археолог']
  игры: ['\bигр', 'steam', 'playstation', 'xbox', 'nintendo', 'геймер']

# topics: false — у источника не подбираются теги по теме, в посте только его тег (например #мир)
sources:
