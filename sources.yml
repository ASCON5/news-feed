  - {name: 3DNews,      type: rss, url: "https://3dnews.ru/news/rss/",            tag: техника}
  - {name: iXBT,        type: rss, url: "https://www.ixbt.com/export/news.rss",   tag: техника}
  # --- ИИ, роботы, технологии будущего ---
